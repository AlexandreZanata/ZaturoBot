name: Repository validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install Linux desktop build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libfontconfig1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate the repository
        run: cargo xtask check --locked

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Compile, lint and test Android without packaging or signing
        working-directory: mobile/android
        run: ./gradlew --no-daemon :app:compileDebugKotlin :app:compileDebugJavaWithJavac :app:testDebugUnitTest :app:lintDebug

  release-bundle:
    needs: [check, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libfontconfig1-dev
      - name: Build release Hub and Worker binaries
        run: cargo build --locked --release -p zaturo-hub -p zaturo-worker
      - name: Assemble verifiable Procurali release bundle
        id: bundle
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::12}"
          TAG="procurali-${SHORT_SHA}"
          STAGE="$(mktemp -d)"
          mkdir -p "${STAGE}/bundle/bin" "${STAGE}/bundle/site-builder" "${STAGE}/bundle/deploy" "${STAGE}/dist"
          install -m 0755 target/release/zaturo-hub "${STAGE}/bundle/bin/zaturo-hub"
          install -m 0755 target/release/zaturo-worker "${STAGE}/bundle/bin/zaturo-worker"
          for sub in src data brand contracts; do
            cp -R "docs/planning/commerce-refined/procurali-prototype/${sub}" "${STAGE}/bundle/site-builder/${sub}"
          done
          cp -R deploy/procurali "${STAGE}/bundle/deploy/procurali"
          tar -C "${STAGE}/bundle" -czf "${STAGE}/dist/procurali-bundle-linux-amd64.tar.gz" .
          BUNDLE_SHA="$(sha256sum "${STAGE}/dist/procurali-bundle-linux-amd64.tar.gz" | awk '{print $1}')"
          HUB_SHA="$(sha256sum "${STAGE}/bundle/bin/zaturo-hub" | awk '{print $1}')"
          WORKER_SHA="$(sha256sum "${STAGE}/bundle/bin/zaturo-worker" | awk '{print $1}')"
          cat > "${STAGE}/dist/manifest.json" <<EOF
          {
            "schema_version": 1,
            "commit_sha": "${GITHUB_SHA}",
            "short_sha": "${SHORT_SHA}",
            "release_tag": "${TAG}",
            "built_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run_id": "${GITHUB_RUN_ID}",
            "bundle_sha256": "${BUNDLE_SHA}",
            "files": {
              "bin/zaturo-hub": "${HUB_SHA}",
              "bin/zaturo-worker": "${WORKER_SHA}"
            }
          }
          EOF
          (cd "${STAGE}/dist" && sha256sum procurali-bundle-linux-amd64.tar.gz manifest.json > SHA256SUMS)
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "dist=${STAGE}/dist" >> "${GITHUB_OUTPUT}"
      - name: Publish immutable CI-verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.bundle.outputs.tag }}"
          DIST="${{ steps.bundle.outputs.dist }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" --clobber \
              "${DIST}/procurali-bundle-linux-amd64.tar.gz" \
              "${DIST}/manifest.json" \
              "${DIST}/SHA256SUMS"
          else
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Procurali Auto-Deploy ${GITHUB_SHA::12}" \
              --notes "Automated zero-downtime release built after check and android passed on main (${GITHUB_SHA})." \
              "${DIST}/procurali-bundle-linux-amd64.tar.gz" \
              "${DIST}/manifest.json" \
              "${DIST}/SHA256SUMS"
          fi
