# Worker-local bridge paths; individual backend profiles stay disabled until reviewed.
python = "/usr/bin/python3"
scripts_root = "/home/owner/.local/lib/zaturobot/computer"
linux_profile = "/home/owner/.config/zaturobot/computer-linux.toml"
# browser_profile = "/home/owner/.config/zaturobot/computer-browser.toml"
# bitlupa_project = "/home/owner/BitLupa"
# bitlupa_database = "/home/owner/.local/share/bitlupa/offers.db"
# social_profile = "/home/owner/.config/zaturobot/social.toml"
# Separate native Wayland chooser; never combine with capture_target.
wayland_portal_capture = false
