# Explicit owner-authorized personal Go route; no Console credit fallback.
enabled = false
provider = "opencode-go"
allow_personal_go = true
default_model = "deepseek-v4.1-flash"
allowed_models = ["deepseek-v4.1-flash"]
allowed_privacy = ["personal"]
allow_training_models = false
allow_global_processing = false
timeout_seconds = 30
max_context_bytes = 8192
max_response_bytes = 8192
max_output_tokens = 384
max_attempts = 1
retry_base_millis = 1000
concurrent_requests = 1

[budget]
per_request_tokens = 12288
per_task_tokens = 12288
per_day_tokens = 100000
per_month_tokens = 1000000
max_task_model_calls = 1
