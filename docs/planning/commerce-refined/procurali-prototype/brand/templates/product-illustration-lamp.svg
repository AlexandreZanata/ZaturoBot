<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Ilustração demonstrativa de luminária barra assimétrica 40 cm sobre monitor">
  <title>Luminária Barra de Monitor Assimétrica 40 cm — Ilustração demonstrativa</title>
  <defs>
    <linearGradient id="warmBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFF8E1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2C24"/>
      <stop offset="50%" stop-color="#0C3824"/>
      <stop offset="100%" stop-color="#072115"/>
    </linearGradient>
    <linearGradient id="barMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3E474E"/>
      <stop offset="100%" stop-color="#171B1E"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="#FFFFFF"/>
  <!-- Asymmetric warm light cone onto keyboard/desk area -->
  <polygon points="118,154 522,154 584,412 56,412" fill="url(#warmBeam)"/>
  <!-- Monitor stand -->
  <rect x="294" y="346" width="52" height="54" rx="4" fill="#2A3238"/>
  <path d="M224 400 H416 C424 400 428 408 428 414 H212 C212 408 216 400 224 400 Z" fill="#1D2429"/>
  <!-- Monitor screen chassis -->
  <rect x="130" y="152" width="380" height="200" rx="12" fill="#14191D" stroke="#2D353C" stroke-width="4"/>
  <rect x="142" y="164" width="356" height="174" rx="6" fill="url(#screenGrad)"/>
  <!-- Subtle crisp workspace UI hints inside monitor -->
  <rect x="166" y="190" width="110" height="16" rx="8" fill="#8BEB28" fill-opacity="0.85"/>
  <rect x="166" y="218" width="180" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.22"/>
  <rect x="166" y="240" width="142" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.16"/>
  <!-- Light bar counterweight bracket -->
  <path d="M286 122 L302 92 H338 L354 122 Z" fill="#252C32" stroke="#111518" stroke-width="2"/>
  <!-- Top asymmetric LED bar (40 cm representation) -->
  <rect x="108" y="114" width="424" height="32" rx="16" fill="url(#barMetal)" stroke="#0B0E10" stroke-width="2.5"/>
  <!-- Subtle warm LED emitter slit underneath -->
  <rect x="130" y="142" width="380" height="4" rx="2" fill="#FFE082"/>
  <!-- Touch control icons on bar -->
  <circle cx="486" cy="130" r="5" fill="#8BEB28"/>
  <circle cx="464" cy="130" r="4" fill="#A9B7C0"/>
</svg>
