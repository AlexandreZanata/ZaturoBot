<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Ilustração demonstrativa de carregador GaN 65W branco 3 portas">
  <title>Carregador GaN 65W 3 Portas — Ilustração demonstrativa</title>
  <defs>
    <linearGradient id="ganWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#EDF2EF"/>
      <stop offset="100%" stop-color="#D2DDD7"/>
    </linearGradient>
    <radialGradient id="ganShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#072617" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#072617" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="480" fill="#FFFFFF"/>
  <ellipse cx="320" cy="390" rx="140" ry="24" fill="url(#ganShadow)"/>
  <!-- NBR 14136 pins -->
  <rect x="274" y="88" width="18" height="48" rx="7" fill="#C4CDD4" stroke="#6E7880" stroke-width="2"/>
  <rect x="348" y="88" width="18" height="48" rx="7" fill="#C4CDD4" stroke="#6E7880" stroke-width="2"/>
  <!-- Compact GaN cube body -->
  <rect x="210" y="134" width="220" height="236" rx="28" fill="url(#ganWhite)" stroke="#B7C5BE" stroke-width="3"/>
  <rect x="228" y="294" width="184" height="58" rx="12" fill="#17201B"/>
  <!-- 2x USB-C & 1x USB-A -->
  <rect x="246" y="314" width="38" height="16" rx="8" fill="#0B110E" stroke="#8BEB28" stroke-width="2"/>
  <rect x="298" y="314" width="38" height="16" rx="8" fill="#0B110E" stroke="#8BEB28" stroke-width="2"/>
  <rect x="350" y="312" width="44" height="20" rx="4" fill="#0B110E" stroke="#9AA8A0" stroke-width="1.8"/>
  <rect x="356" y="320" width="32" height="5" rx="2" fill="#0E6B38"/>
  <!-- Front badge -->
  <rect x="260" y="176" width="120" height="40" rx="20" fill="#DFF5E5"/>
  <text x="320" y="203" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="22" font-weight="800" fill="#0C5E31">65W GaN</text>
  <circle cx="320" cy="248" r="5" fill="#8BEB28"/>
</svg>
