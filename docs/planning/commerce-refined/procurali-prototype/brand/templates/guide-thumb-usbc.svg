<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" role="img" aria-label="Ilustração editorial para comparativo de hubs USB-C e carregadores GaN">
  <title>Comparativo — Hubs USB-C e GaN</title>
  <defs>
    <linearGradient id="bgUsb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072617"/>
      <stop offset="100%" stop-color="#0F5431"/>
    </linearGradient>
  </defs>
  <rect width="320" height="260" rx="14" fill="url(#bgUsb)"/>
  <circle cx="265" cy="48" r="78" fill="#8BEB28" fill-opacity="0.14"/>
  <!-- Hub module -->
  <rect x="44" y="96" width="154" height="72" rx="16" fill="#2A3339" stroke="#8BEB28" stroke-width="2.5"/>
  <text x="64" y="128" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">USB-C PD</text>
  <text x="64" y="149" font-family="'Fira Mono', monospace" font-size="13" fill="#8BEB28">4K30 · 100W</text>
  <!-- GaN block side by side -->
  <rect x="206" y="72" width="76" height="114" rx="18" fill="#FFFFFF"/>
  <rect x="220" y="92" width="48" height="24" rx="12" fill="#DFF5E5"/>
  <text x="244" y="109" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="14" font-weight="800" fill="#0C5E31">65W</text>
  <rect x="222" y="142" width="44" height="24" rx="6" fill="#17201C"/>
  <circle cx="235" cy="154" r="4" fill="#8BEB28"/>
  <circle cx="253" cy="154" r="4" fill="#8BEB28"/>
</svg>
