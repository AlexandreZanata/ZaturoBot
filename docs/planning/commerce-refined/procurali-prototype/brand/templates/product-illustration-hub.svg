<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Ilustração demonstrativa de hub USB-C 7 em 1 cinza espacial">
  <title>Hub USB-C 7 em 1 PD 100W — Ilustração demonstrativa</title>
  <defs>
    <linearGradient id="hubBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#535D66"/>
      <stop offset="48%" stop-color="#384047"/>
      <stop offset="100%" stop-color="#22282D"/>
    </linearGradient>
    <linearGradient id="hubBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#76828D"/>
      <stop offset="100%" stop-color="#2E343A"/>
    </linearGradient>
    <radialGradient id="hubShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#072617" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#072617" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="480" fill="#FFFFFF"/>
  <ellipse cx="320" cy="368" rx="220" ry="26" fill="url(#hubShadow)"/>
  <!-- Braided USB-C cable -->
  <path d="M196 270 C128 270 96 232 104 184 C112 138 158 116 218 116" fill="none" stroke="#2D3339" stroke-width="14" stroke-linecap="round"/>
  <path d="M196 270 C128 270 96 232 104 184 C112 138 158 116 218 116" fill="none" stroke="#5D6770" stroke-width="4" stroke-dasharray="6 8" stroke-linecap="round"/>
  <!-- USB-C connector head -->
  <rect x="216" y="96" width="68" height="38" rx="10" fill="url(#hubBody)" stroke="#191D20" stroke-width="2.5"/>
  <rect x="284" y="106" width="24" height="18" rx="5" fill="#B9C3CC" stroke="#535D66" stroke-width="2"/>
  <!-- Hub aluminum chassis -->
  <rect x="192" y="218" width="320" height="106" rx="22" fill="url(#hubBody)" stroke="#1B2024" stroke-width="3"/>
  <rect x="200" y="224" width="304" height="44" rx="14" fill="url(#hubBevel)" opacity="0.55"/>
  <!-- Status LED -->
  <circle cx="484" cy="244" r="5.5" fill="#8BEB28"/>
  <!-- Subtle logo mark on top -->
  <text x="228" y="250" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="700" fill="#DCE4EA" letter-spacing="1">USB-C 7-EM-1 · PD 100W</text>
  <!-- Front port bezel -->
  <rect x="210" y="276" width="284" height="36" rx="8" fill="#161A1D"/>
  <!-- USB-A 3.0 Blue ports -->
  <rect x="224" y="285" width="38" height="18" rx="3" fill="#0B1115" stroke="#5C6670" stroke-width="1.5"/>
  <rect x="228" y="294" width="30" height="5" rx="1.5" fill="#2A7CE2"/>
  <rect x="272" y="285" width="38" height="18" rx="3" fill="#0B1115" stroke="#5C6670" stroke-width="1.5"/>
  <rect x="276" y="294" width="30" height="5" rx="1.5" fill="#2A7CE2"/>
  <!-- HDMI 4K port -->
  <path d="M324 285 H366 V297 L360 303 H330 L324 297 Z" fill="#0B1115" stroke="#78838E" stroke-width="1.5"/>
  <!-- USB-C PD & Data ports -->
  <rect x="380" y="288" width="28" height="12" rx="6" fill="#0B1115" stroke="#8BEB28" stroke-width="1.8"/>
  <rect x="418" y="288" width="26" height="12" rx="6" fill="#0B1115" stroke="#78838E" stroke-width="1.5"/>
  <!-- SD card slot -->
  <rect x="454" y="286" width="30" height="16" rx="2" fill="#0B1115" stroke="#78838E" stroke-width="1.5"/>
</svg>
