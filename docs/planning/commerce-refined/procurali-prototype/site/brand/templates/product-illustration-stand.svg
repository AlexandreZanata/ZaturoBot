<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Ilustração demonstrativa de suporte articulado em alumínio para notebook">
  <title>Suporte Articulado de Alumínio V2 — Ilustração demonstrativa</title>
  <defs>
    <linearGradient id="aluTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECEF"/>
      <stop offset="50%" stop-color="#C8D0D6"/>
      <stop offset="100%" stop-color="#9CA6AE"/>
    </linearGradient>
    <linearGradient id="aluArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B868E"/>
      <stop offset="100%" stop-color="#4A545B"/>
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#072617" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#072617" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="480" fill="#FFFFFF"/>
  <ellipse cx="320" cy="392" rx="190" ry="26" fill="url(#floorShadow)"/>
  <!-- Heavy base plate -->
  <path d="M162 344 L452 344 L484 378 L138 378 Z" fill="url(#aluTop)" stroke="#6B757D" stroke-width="3" stroke-linejoin="round"/>
  <path d="M138 378 L484 378 L484 388 L138 388 Z" fill="#8C979F"/>
  <!-- Silicone base pads -->
  <rect x="176" y="348" width="52" height="8" rx="4" fill="#1D262B"/>
  <rect x="386" y="348" width="52" height="8" rx="4" fill="#1D262B"/>
  <!-- Articulated rear arms -->
  <path d="M222 356 L266 196 L296 196 L252 356 Z" fill="url(#aluArm)" stroke="#2F383D" stroke-width="2.5"/>
  <path d="M366 356 L388 182 L416 182 L396 356 Z" fill="url(#aluArm)" stroke="#2F383D" stroke-width="2.5"/>
  <!-- Upper hinge pins -->
  <circle cx="280" cy="196" r="14" fill="#0E6B38" stroke="#1D262B" stroke-width="3"/>
  <circle cx="280" cy="196" r="5" fill="#8BEB28"/>
  <circle cx="402" cy="182" r="14" fill="#0E6B38" stroke="#1D262B" stroke-width="3"/>
  <circle cx="402" cy="182" r="5" fill="#8BEB28"/>
  <!-- Angled aluminum laptop platform -->
  <path d="M142 194 L424 102 L486 130 L204 226 Z" fill="url(#aluTop)" stroke="#5E6870" stroke-width="3" stroke-linejoin="round"/>
  <path d="M142 194 L204 226 L194 246 L132 214 Z" fill="#8C979F" stroke="#5E6870" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Front hook stoppers with rubber pads -->
  <path d="M148 196 L136 176 L150 172 L162 192 Z" fill="#1E2528"/>
  <path d="M188 214 L176 194 L190 190 L202 210 Z" fill="#1E2528"/>
  <!-- Ventilation center cutout -->
  <path d="M256 168 L368 131 L398 144 L286 182 Z" fill="#E9F0EC" stroke="#8C979F" stroke-width="2"/>
  <!-- Top anti-slip silicone strips -->
  <path d="M184 184 L216 174 L224 179 L192 189 Z" fill="#1E2528"/>
  <path d="M388 118 L420 108 L428 113 L396 123 Z" fill="#1E2528"/>
</svg>
