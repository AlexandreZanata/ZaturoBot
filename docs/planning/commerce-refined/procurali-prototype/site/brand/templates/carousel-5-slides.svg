<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2860 720" width="2860" height="720" role="img" aria-label="Carrossel de 5 slides Procurali">
  <title>Carrossel 5 slides — Necessidade, Critérios, Escolha/Tradeoff, Condição e CTA</title>
  <rect width="2860" height="720" fill="#F2EFE7"/>

  <!-- Slide 1: Necessidade -->
  <g transform="translate(28, 22)">
    <rect width="540" height="675" rx="20" fill="#123D3B"/>
    <rect x="36" y="36" width="110" height="36" rx="18" fill="#DCECB0"/>
    <text x="91" y="61" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="18" font-weight="700" fill="#123D3B">SLIDE 1/5</text>
    <text x="498" y="60" text-anchor="end" font-family="'Fira Sans', sans-serif" font-size="20" font-weight="700" fill="#FAF8F3">#publi</text>
    <text x="36" y="150" font-family="'Fira Sans', sans-serif" font-size="20" font-weight="700" fill="#DCECB0">NECESSIDADE REAL</text>
    <text x="36" y="216" font-family="'Fira Sans', sans-serif" font-size="40" font-weight="700" fill="#FAF8F3">Dor no pescoço</text>
    <text x="36" y="266" font-family="'Fira Sans', sans-serif" font-size="40" font-weight="700" fill="#FAF8F3">ao usar o notebook</text>
    <text x="36" y="316" font-family="'Fira Sans', sans-serif" font-size="40" font-weight="700" fill="#FAF8F3">na mesa?</text>
    <text x="36" y="390" font-family="'Fira Sans', sans-serif" font-size="24" fill="#FAF8F3">Elevar a tela até a altura dos olhos</text>
    <text x="36" y="424" font-family="'Fira Sans', sans-serif" font-size="24" fill="#FAF8F3">ajuda, mas nem todo suporte serve</text>
    <text x="36" y="458" font-family="'Fira Sans', sans-serif" font-size="24" fill="#FAF8F3">para o peso e a rotina da sua mesa.</text>
    <rect x="36" y="556" width="468" height="68" rx="12" fill="#ED6346"/>
    <text x="270" y="598" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="22" font-weight="700" fill="#0D1D1C">Veja os 3 critérios antes de comprar →</text>
  </g>

  <!-- Slide 2: Critérios -->
  <g transform="translate(594, 22)">
    <rect width="540" height="675" rx="20" fill="#FAF8F3" stroke="#DCD7CA" stroke-width="2"/>
    <rect x="36" y="36" width="110" height="36" rx="18" fill="#123D3B"/>
    <text x="91" y="61" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="18" font-weight="700" fill="#FAF8F3">SLIDE 2/5</text>
    <text x="36" y="138" font-family="'Fira Sans', sans-serif" font-size="20" font-weight="700" fill="#A8361E">CRITÉRIOS DE COMPRA</text>
    <text x="36" y="192" font-family="'Fira Sans', sans-serif" font-size="36" font-weight="700" fill="#123D3B">O que olhar na ficha</text>
    <rect x="36" y="232" width="468" height="104" rx="14" fill="#FFFFFF" stroke="#DCD7CA" stroke-width="2"/>
    <text x="58" y="274" font-family="'Fira Sans', sans-serif" font-size="22" font-weight="700" fill="#123D3B">1. Carga suportada e folga</text>
    <text x="58" y="308" font-family="'Fira Sans', sans-serif" font-size="19" fill="#4E5A58">Prefira folga acima do peso real do notebook.</text>
    <rect x="36" y="354" width="468" height="104" rx="14" fill="#FFFFFF" stroke="#DCD7CA" stroke-width="2"/>
    <text x="58" y="396" font-family="'Fira Sans', sans-serif" font-size="22" font-weight="700" fill="#123D3B">2. Rigidez da dobradiça</text>
    <text x="58" y="430" font-family="'Fira Sans', sans-serif" font-size="19" fill="#4E5A58">Modelos articulados precisam de parafuso firme.</text>
    <rect x="36" y="476" width="468" height="104" rx="14" fill="#FFFFFF" stroke="#DCD7CA" stroke-width="2"/>
    <text x="58" y="518" font-family="'Fira Sans', sans-serif" font-size="22" font-weight="700" fill="#123D3B">3. Teclado e mouse separados</text>
    <text x="58" y="552" font-family="'Fira Sans', sans-serif" font-size="19" fill="#4E5A58">Digitar inclinado no suporte cansa os punhos.</text>
    <text x="36" y="636" font-family="'Fira Sans', sans-serif" font-size="18" font-weight="700" fill="#123D3B">procurali · Pesquisa de bancada</text>
  </g>

  <!-- Slide 3: Escolha e tradeoff -->
  <g transform="translate(1160, 22)">
    <rect width="540" height="675" rx="20" fill="#FAF8F3" stroke="#DCD7CA" stroke-width="2"/>
    <rect x="36" y="36" width="110" height="36" rx="18" fill="#123D3B"/>
    <text x="91" y="61" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="18" font-weight="700" fill="#FAF8F3">SLIDE 3/5</text>
    <text x="36" y="138" font-family="'Fira Sans', sans-serif" font-size="20" font-weight="700" fill="#A8361E">ESCOLHA E CONTRAPONTO</text>
    <text x="36" y="192" font-family="'Fira Sans', sans-serif" font-size="34" font-weight="700" fill="#123D3B">Suporte Alumínio V2</text>
    <rect x="36" y="226" width="468" height="164" rx="14" fill="#DCECB0"/>
    <text x="58" y="266" font-family="'Fira Sans', sans-serif" font-size="21" font-weight="700" fill="#123D3B">Onde faz sentido:</text>
    <text x="58" y="302" font-family="'Fira Sans', sans-serif" font-size="20" fill="#123D3B">• Mesa fixa ou híbrida com tela até 16".</text>
    <text x="58" y="334" font-family="'Fira Sans', sans-serif" font-size="20" fill="#123D3B">• Ajuste de altura sem ocupar toda a base.</text>
    <text x="58" y="366" font-family="'Fira Sans', sans-serif" font-size="20" fill="#123D3B">• Recorte para ventilação sob o aparelho.</text>
    <rect x="36" y="410" width="468" height="164" rx="14" fill="#FDF1DA" stroke="#B36B08" stroke-width="2"/>
    <text x="58" y="450" font-family="'Fira Sans', sans-serif" font-size="21" font-weight="700" fill="#6C4000">Limitação importante:</text>
    <text x="58" y="486" font-family="'Fira Sans', sans-serif" font-size="20" fill="#6C4000">• Pesa ~780 g: menos prático na mochila.</text>
    <text x="58" y="518" font-family="'Fira Sans', sans-serif" font-size="20" fill="#6C4000">• Exige teclado externo para uso alto.</text>
    <text x="58" y="550" font-family="'Fira Sans', sans-serif" font-size="20" fill="#6C4000">• Não acompanha chave Allen reserva.</text>
    <text x="36" y="636" font-family="'Fira Sans', sans-serif" font-size="18" fill="#4E5A58">Dados fictícios de demonstração · procurali</text>
  </g>

  <!-- Slide 4: Condição -->
  <g transform="translate(1726, 22)">
    <rect width="540" height="675" rx="20" fill="#FAF8F3" stroke="#DCD7CA" stroke-width="2"/>
    <rect x="36" y="36" width="110" height="36" rx="18" fill="#123D3B"/>
    <text x="91" y="61" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="18" font-weight="700" fill="#FAF8F3">SLIDE 4/5</text>
    <text x="36" y="138" font-family="'Fira Sans', sans-serif" font-size="20" font-weight="700" fill="#A8361E">CONDIÇÃO OBSERVADA (DEMO)</text>
    <text x="36" y="192" font-family="'Fira Sans', sans-serif" font-size="34" font-weight="700" fill="#123D3B">Confira variante e CEP</text>
    <rect x="36" y="232" width="468" height="190" rx="16" fill="#123D3B"/>
    <text x="64" y="280" font-family="'Fira Sans', sans-serif" font-size="20" fill="#DCECB0">Exemplo ilustrativo · Loja Oficial Demo</text>
    <text x="64" y="346" font-family="'Fira Sans', sans-serif" font-size="56" font-weight="700" fill="#FAF8F3">R$ 89,90</text>
    <text x="64" y="392" font-family="'Fira Sans', sans-serif" font-size="20" fill="#FAF8F3">À vista no Pix · Variante Prata (V2)</text>
    <rect x="36" y="444" width="468" height="148" rx="14" fill="#FFFFFF" stroke="#DCD7CA" stroke-width="2"/>
    <text x="58" y="486" font-family="'Fira Sans', sans-serif" font-size="20" font-weight="700" fill="#123D3B">Antes de fechar:</text>
    <text x="58" y="520" font-family="'Fira Sans', sans-serif" font-size="19" fill="#4E5A58">• Verifique o valor do frete para o seu CEP.</text>
    <text x="58" y="552" font-family="'Fira Sans', sans-serif" font-size="19" fill="#4E5A58">• Observação registrada em 15/11/2026 14:15.</text>
    <text x="36" y="636" font-family="'Fira Sans', sans-serif" font-size="18" fill="#4E5A58">Preço sujeito a alteração na loja · procurali</text>
  </g>

  <!-- Slide 5: CTA -->
  <g transform="translate(2292, 22)">
    <rect width="540" height="675" rx="20" fill="#123D3B"/>
    <rect x="36" y="36" width="110" height="36" rx="18" fill="#DCECB0"/>
    <text x="91" y="61" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="18" font-weight="700" fill="#123D3B">SLIDE 5/5</text>
    <text x="498" y="60" text-anchor="end" font-family="'Fira Sans', sans-serif" font-size="20" font-weight="700" fill="#FAF8F3">#publi</text>
    <text x="36" y="182" font-family="'Fira Sans', sans-serif" font-size="40" font-weight="700" fill="#FAF8F3">Quer comparar</text>
    <text x="36" y="232" font-family="'Fira Sans', sans-serif" font-size="40" font-weight="700" fill="#FAF8F3">outras opções</text>
    <text x="36" y="282" font-family="'Fira Sans', sans-serif" font-size="40" font-weight="700" fill="#FAF8F3">por faixa de preço?</text>
    <rect x="36" y="336" width="468" height="84" rx="14" fill="#ED6346"/>
    <text x="270" y="387" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="25" font-weight="700" fill="#0D1D1C">Acesse procurali.com.br (protótipo)</text>
    <text x="36" y="472" font-family="'Fira Sans', sans-serif" font-size="22" fill="#DCECB0">Canal Telegram: t.me/procurali</text>
    <text x="36" y="534" font-family="'Fira Sans', sans-serif" font-size="19" fill="#FAF8F3">Link de afiliado: podemos receber comissão</text>
    <text x="36" y="564" font-family="'Fira Sans', sans-serif" font-size="19" fill="#FAF8F3">se você comprar na loja oficial.</text>
    <text x="36" y="628" font-family="'Fira Mono', monospace" font-size="17" fill="#DCECB0">procurali · Achados que fazem sentido.</text>
  </g>
</svg>
