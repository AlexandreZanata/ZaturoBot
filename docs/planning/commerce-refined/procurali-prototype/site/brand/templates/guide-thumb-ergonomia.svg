<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" role="img" aria-label="Ilustração editorial para guia de suporte de notebook">
  <title>Guia de compra — Suporte e ergonomia</title>
  <defs>
    <linearGradient id="bgErg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7F2EC"/>
      <stop offset="100%" stop-color="#C8DFD1"/>
    </linearGradient>
    <linearGradient id="screenErg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3A8A"/>
      <stop offset="50%" stop-color="#0E6B38"/>
      <stop offset="100%" stop-color="#8BEB28"/>
    </linearGradient>
  </defs>
  <rect width="320" height="260" rx="14" fill="url(#bgErg)"/>
  <!-- Desk surface -->
  <rect x="0" y="198" width="320" height="62" fill="#DCE8E1"/>
  <!-- Aluminum stand + laptop -->
  <path d="M108 198 H212 L222 214 H98 Z" fill="#A9B7BE"/>
  <path d="M138 198 L154 146 H172 L156 198 Z" fill="#6D7C84"/>
  <!-- Laptop lid open -->
  <rect x="78" y="54" width="164" height="102" rx="10" fill="#17201C"/>
  <rect x="86" y="62" width="148" height="86" rx="5" fill="url(#screenErg)"/>
  <!-- Keyboard deck angled -->
  <path d="M78 156 L242 156 L262 178 L58 178 Z" fill="#C4CED4"/>
  <rect x="92" y="162" width="136" height="9" rx="3" fill="#3B454B"/>
</svg>
