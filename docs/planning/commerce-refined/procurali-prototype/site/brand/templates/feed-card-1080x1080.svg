<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Template de card de oferta 1080 por 1080">
  <title>Template Procurali — Feed Card 1080×1080 (Demonstração)</title>
  <rect width="1080" height="1080" fill="#FAF8F3"/>
  <rect x="38" y="38" width="1004" height="1004" rx="22" fill="#FFFFFF" stroke="#DCD7CA" stroke-width="3"/>

  <!-- Header -->
  <rect x="74" y="72" width="136" height="44" rx="22" fill="#123D3B"/>
  <text x="142" y="102" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="22" font-weight="700" fill="#FAF8F3">#publi</text>
  <rect x="226" y="72" width="268" height="44" rx="22" fill="#DCECB0"/>
  <text x="360" y="101" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="19" font-weight="700" fill="#123D3B">ADAPTAÇÃO 1:1 (DEMO)</text>
  <text x="1002" y="104" text-anchor="end" font-family="'Fira Sans', sans-serif" font-size="30" font-weight="700" letter-spacing="-1" fill="#123D3B">procurali</text>

  <!-- Headline -->
  <text x="74" y="182" font-family="'Fira Sans', sans-serif" font-size="38" font-weight="700" fill="#123D3B">Hub USB-C 7 em 1 PD 100W para notebook</text>
  <text x="74" y="224" font-family="'Fira Sans', sans-serif" font-size="23" fill="#4E5A58">Para quem precisa ligar HDMI 4K, rede/USB-A e energia em uma única porta</text>

  <!-- Asset slot -->
  <rect x="74" y="254" width="932" height="340" rx="18" fill="#F2EFE7" stroke="#B8B2A3" stroke-width="2" stroke-dasharray="10 8"/>
  <g transform="translate(340, 326)" stroke="#123D3B" stroke-width="6" fill="none">
    <rect x="40" y="48" width="320" height="84" rx="16" fill="#FFFFFF"/>
    <rect x="72" y="74" width="44" height="32" rx="4" fill="#DCECB0"/>
    <rect x="136" y="74" width="44" height="32" rx="4" fill="#DCECB0"/>
    <rect x="200" y="74" width="44" height="32" rx="4" fill="#ED6346"/>
    <rect x="268" y="78" width="52" height="24" rx="12" fill="#123D3B"/>
    <path d="M40 90 H-20" stroke-width="7"/>
  </g>
  <text x="540" y="568" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="19" fill="#4E5A58">ZONA DE MÍDIA LICENCIADA · ILUSTRAÇÃO DEMONSTRATIVA</text>

  <!-- Price box -->
  <rect x="74" y="618" width="932" height="142" rx="16" fill="#123D3B"/>
  <text x="108" y="664" font-family="'Fira Sans', sans-serif" font-size="22" fill="#DCECB0">Observação demonstrativa · 15/11/2026 14:20 BRT</text>
  <text x="108" y="726" font-family="'Fira Sans', sans-serif" font-size="56" font-weight="700" fill="#FAF8F3">R$ 139,90</text>
  <text x="410" y="718" font-family="'Fira Sans', sans-serif" font-size="22" fill="#FAF8F3">À vista no Pix · Frete depende do CEP</text>

  <!-- Caveat -->
  <rect x="74" y="784" width="932" height="92" rx="14" fill="#FDF1DA" stroke="#B36B08" stroke-width="2"/>
  <text x="104" y="822" font-family="'Fira Sans', sans-serif" font-size="22" font-weight="700" fill="#6C4000">Atenção à porta do aparelho:</text>
  <text x="104" y="856" font-family="'Fira Sans', sans-serif" font-size="21" fill="#6C4000">Saída HDMI exige porta USB-C com modo DisplayPort Alt no notebook.</text>

  <!-- CTA & Disclosure -->
  <rect x="74" y="900" width="356" height="66" rx="12" fill="#ED6346"/>
  <text x="252" y="942" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="25" font-weight="700" fill="#0D1D1C">Ver oferta (demo)</text>
  <text x="454" y="928" font-family="'Fira Sans', sans-serif" font-size="18.5" font-weight="600" fill="#123D3B">Link de afiliado: podemos receber comissão se comprar.</text>
  <text x="454" y="958" font-family="'Fira Sans', sans-serif" font-size="16.5" fill="#4E5A58">Preço e disponibilidade mudam; confirme na loja oficial.</text>
</svg>
