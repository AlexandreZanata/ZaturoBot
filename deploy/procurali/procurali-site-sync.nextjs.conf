# systemd drop-in for procurali-site-sync.service: room for the Next.js static export.
#
# Install as /etc/systemd/system/procurali-site-sync.service.d/10-nextjs-build.conf, then
# `systemctl daemon-reload && systemctl restart procurali-site-sync`.
#
# The base unit's MemoryHigh=256M / MemoryMax=512M / CPUQuota=50% suited the former
# string-template builder; `next build` (2 static-generation workers, PROCURALI_BUILD_CPUS)
# thrashes under them. The sandbox itself (ProtectSystem=strict, ProtectHome=true,
# ReadWritePaths) is unchanged: the builder copies the read-only release into
# /var/lib/procurali-site-sync/builder/ and keeps TMPDIR/HOME there.
[Service]
MemoryHigh=1536M
MemoryMax=2G
CPUQuota=200%
